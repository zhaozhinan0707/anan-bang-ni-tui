<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>灵感空间</title>
<style>
:root{--bg:#f6f4f1;--panel:#fff;--ink:#241f27;--muted:#817985;--line:#e8e3e0;--accent:#6d28d9;--soft:#f0eaff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,"Microsoft YaHei",sans-serif}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 22px}.brand{font-weight:700;font-size:16px}.switch{display:flex;gap:4px;background:#f5f2ef;padding:4px;border-radius:9px}.switch button,.btn,.group{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}.switch button.active,.group.active{color:var(--accent);background:var(--soft);border-color:#cdbcf8}.spacer{flex:1}.primary{background:var(--accent);color:white;border-color:var(--accent)}.layout{height:calc(100vh - 58px);display:grid;grid-template-columns:210px minmax(0,1fr) 250px}.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px}.side h3{font-size:12px;color:var(--muted);margin:4px 10px 10px}.project{padding:10px;border-radius:8px;cursor:pointer}.project.active{background:var(--soft);color:var(--accent);font-weight:600}.add{color:var(--accent);padding:10px;cursor:pointer}.main{padding:22px 26px;overflow:auto}.head{display:flex;align-items:center;margin-bottom:18px}.head h1{margin:0;font-size:25px}.muted,.small{color:var(--muted);font-size:12px}.view{margin-left:auto}.groups{display:flex;gap:8px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}.asset{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}.asset.selected{outline:2px solid var(--accent)}.canvas .asset.selected{outline:none!important;border:0!important;box-shadow:none!important}.asset img{width:100%;height:190px;display:block;object-fit:cover}.meta{padding:10px}.title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.drop{border:1px dashed #cdbcf8;background:#faf8ff;border-radius:10px;padding:15px;text-align:center;color:var(--muted);margin-bottom:18px}.canvas{position:relative;width:100%;height:calc(100vh - 148px);min-height:560px;background-color:#fff;background-image:none;border:1px solid var(--line);border-radius:12px;overflow:hidden}.canvas .asset{position:absolute;border:0!important;outline:none!important;box-shadow:none!important;background:transparent;width:260px;height:190px;min-width:140px;min-height:100px;resize:none;overflow:hidden;cursor:grab;touch-action:none}.canvas .asset:active{cursor:grabbing}.canvas.dropActive{outline:2px dashed var(--accent)}.marquee{position:absolute;border:1px solid var(--accent);background:#6d28d922;pointer-events:none;z-index:10}.canvas .asset img{width:100%;height:100%;max-height:none;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}.canvas .meta{display:none}.detail{background:#fff;border-left:1px solid var(--line);padding:20px;overflow:auto}.detail img{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#f2efec}.label{font-size:11px;color:var(--muted);margin:15px 0 4px}.link{word-break:break-all;color:var(--accent)}@media(max-width:850px){.layout{grid-template-columns:170px 1fr}.detail{display:none}}
/* 与提示词库保持一致的紧凑密度与自适应布局 */.top{height:44px;padding:0 16px;gap:10px;font-size:12px}.brand{font-size:13px}.layout{height:calc(100vh - 44px);grid-template-columns:180px minmax(0,1fr) 210px}.side{padding:14px 10px}.main{padding:16px 20px;min-width:0}.head{margin-bottom:12px}.head h1{font-size:20px}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.asset img{height:160px}.meta{padding:8px}.detail{padding:16px}.drop{padding:11px;margin-bottom:12px}.groups{margin-bottom:12px;gap:6px}.switch button,.btn,.group{padding:5px 9px;font-size:12px}@media(max-width:1050px){.layout{grid-template-columns:160px minmax(0,1fr) 180px}.main{padding:14px}.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}.asset img{height:140px}}@media(max-width:760px){.layout{grid-template-columns:150px minmax(0,1fr)}.detail{display:none}.top{padding:0 10px}}body.dark{--bg:#1d1d1d;--panel:#282828;--ink:#f2f0ed;--muted:#aaa3a0;--line:#3c3938;--soft:#33294b}body.dark .top,body.dark .side,body.dark .detail{background:#252525}body.dark .asset,body.dark .btn,body.dark .group,body.dark .switch{background:#2b2b2b;color:var(--ink)}body.dark .drop{background:#292433;border-color:#7552b5}body.dark .canvas{background-color:#242424;background-image:none}body.dark input{background:#303030;color:var(--ink);border-color:var(--line)}body.dark .top,body.dark .top button,body.dark .side h3,body.dark .detail h3,body.dark .head h1,body.dark .project,body.dark .add{color:var(--ink)}body.dark .muted,body.dark .small,body.dark .label{color:#c2bbb8}body.dark .switch button{color:#f2f0ed;background:#303030}body.dark .switch button.active{color:#fff;background:#5b21b6;border-color:#8b5cf6}.main{overflow:hidden!important;display:flex;flex-direction:column}.main>#workspace{flex:1;min-height:0;overflow:hidden}.canvas{height:100%!important;min-height:0!important;overflow:hidden!important;transform-origin:0 0}</style></head><body>
<header class="top"><div class="brand">Prompt Vault</div><div class="switch"><button onclick="location.href='index.html'">提示词库</button><button class="active">灵感空间</button></div><div class="spacer"></div><button class="btn" id="paste">粘贴图片</button><button class="btn" id="themeToggle" title="切换黑白模式">◐ 黑白</button><button class="btn primary" id="import">导入图片</button><input id="file" type="file" accept="image/*" multiple hidden></header>
<div class="layout"><aside class="side"><h3>项目</h3><div id="projects"></div><div class="add" id="newProject">＋ 新建项目</div></aside><main class="main"><div class="head"><div><h1 id="name"></h1><div class="muted" id="count"></div></div><input id="filter" placeholder="搜索图片…" style="margin-left:24px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;width:180px"><div class="view"><button data-view="library" class="active">图片库</button><button data-view="canvas">画布</button></div></div><div class="drop" id="drop" style="display:none"></div><div class="groups" id="groups"></div><div id="workspace"></div></main><aside class="detail" id="detail"><h3>选择一张图片</h3><p class="muted">图片可以继续以图搜图或交给提示词反推模块。</p></aside></div>
<script>
const KEY='promptVault.inspiration.v1';const THEME='promptVault.inspiration.theme';document.body.classList.toggle('dark',localStorage.getItem(THEME)==='dark');let s=JSON.parse(localStorage.getItem(KEY)||'null')||{projects:[{id:'default',name:'未命名项目',groups:[{id:'all',name:'全部图片'},{id:'ref',name:'参考图'}],assets:[]}],current:'default',view:'library',group:'all',selected:null};const p=()=>s.projects.find(x=>x.id===s.current)||s.projects[0],save=()=>localStorage.setItem(KEY,JSON.stringify(s)),esc=x=>{const d=document.createElement('div');d.textContent=x||'';return d.innerHTML};
function render(){let q=p(),keyword=(filter.value||'').toLowerCase(),items=s.group==='all'?q.assets:q.assets.filter(x=>x.group===s.group);items=items.filter(x=>!keyword||(`${x.title} ${x.source}`).toLowerCase().includes(keyword));name.textContent=q.name;count.textContent=q.assets.length+' 张图片';projects.innerHTML=s.projects.map(x=>`<div class="project ${x.id===q.id?'active':''}" data-id="${x.id}">${esc(x.name)} <span style="float:right">${x.assets.length}</span></div>`).join('');groups.innerHTML=q.groups.map(g=>`<button class="group ${g.id===s.group?'active':''}" data-group="${g.id}">${esc(g.name)}</button>`).join('');workspace.innerHTML=s.view==='canvas'?`<div class="canvas">${items.map(card).join('')}</div>`:`<div class="grid">${items.map(card).join('')}</div>`;document.querySelectorAll('.project').forEach(e=>e.onclick=()=>{s.current=e.dataset.id;s.group='all';s.selected=null;save();render()});document.querySelectorAll('.group').forEach(e=>e.onclick=()=>{s.group=e.dataset.group;render()});filter.oninput=render;document.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>{s.view=e.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===e));render()});document.querySelectorAll('.asset').forEach(e=>e.onclick=()=>{s.selected=e.dataset.id;render()});document.querySelectorAll('.project').forEach(e=>{e.ondblclick=()=>{const q=p(),n=prompt('重命名项目',q.name);if(n&&n.trim()){q.name=n.trim();save();render()}};e.oncontextmenu=ev=>{ev.preventDefault();if(s.projects.length>1&&confirm('删除该项目及其中图片？')){s.projects=s.projects.filter(x=>x.id!==e.dataset.id);s.current=s.projects[0].id;s.selected=null;save();render()}}});if(s.view==='canvas'){enableCanvasDrag();enableCanvasDropAndGroups();enableCanvasWheel()}detailView()}
function enableCanvasWheel(){const c=document.querySelector('.canvas');if(!c)return;c.onwheel=e=>{e.preventDefault();const now=Number(c.dataset.zoom||1),next=Math.max(.35,Math.min(2.5,now*(e.deltaY<0?1.1:.9)));c.dataset.zoom=next;c.style.transform='scale('+next+')';c.style.transformOrigin='0 0'}}
function enableCanvasDropAndGroups(){const c=document.querySelector('.canvas');if(!c)return;c.ondragover=e=>{e.preventDefault();c.classList.add('dropActive')};c.ondragleave=()=>c.classList.remove('dropActive');c.ondrop=e=>{e.preventDefault();c.classList.remove('dropActive');[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).forEach(f=>add(f,'拖入导入'))};let box,startX,startY;c.onpointerdown=e=>{if(e.target!==c)return;const r=c.getBoundingClientRect(),z=Number(c.dataset.zoom||1);startX=(e.clientX-r.left)/z;startY=(e.clientY-r.top)/z;box=document.createElement('div');box.className='marquee';Object.assign(box.style,{left:startX+'px',top:startY+'px',width:'0px',height:'0px'});c.append(box);c.setPointerCapture(e.pointerId);c.onpointermove=m=>{const x=(m.clientX-r.left)/z,y=(m.clientY-r.top)/z;Object.assign(box.style,{left:Math.min(startX,x)+'px',top:Math.min(startY,y)+'px',width:Math.abs(x-startX)+'px',height:Math.abs(y-startY)+'px'})};c.onpointerup=()=>{const b={x:box.offsetLeft,y:box.offsetTop,w:box.offsetWidth,h:box.offsetHeight},ids=[...c.querySelectorAll('.asset')].filter(el=>el.offsetLeft>=b.x&&el.offsetTop>=b.y&&el.offsetLeft+el.offsetWidth<=b.x+b.w&&el.offsetTop+el.offsetHeight<=b.y+b.h).map(el=>el.dataset.id);box.remove();box=null;c.onpointermove=null;if(!ids.length)return;const n=window.prompt('给框选图片命名分组');if(n&&n.trim()){const q=p(),id=crypto.randomUUID();q.groups.push({id,name:n.trim()});q.assets.forEach(a=>{if(ids.includes(a.id))a.group=id});s.group=id;save();render()}}}}function card(a){return`<article class="asset ${a.id===s.selected?'selected':''}" data-id="${a.id}" style="${s.view==='canvas'?`left:${a.x}px;top:${a.y}px;width:${a.w||260}px;height:${a.h||190}px`:''}"><img src="${a.data}" alt=""><div class="meta"><div class="title">${esc(a.title)}</div><div class="small">${esc(a.source||'本地导入')}</div></div></article>`}function enableCanvasDrag(){document.querySelectorAll('.canvas .asset').forEach(e=>{e.style.touchAction='none';const img=e.querySelector('img');if(img)img.draggable=false;let mode=null,startX=0,startY=0,startW=0,startH=0,startL=0,startT=0;const edge=ev=>{const r=e.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top,n=12;return{x:x<n?-1:x>r.width-n?1:0,y:y<n?-1:y>r.height-n?1:0}};e.onpointermove=ev=>{if(mode)return;const q=edge(ev);e.style.cursor=q.x||q.y?(q.x&&q.y?(q.x===q.y?'nwse-resize':'nesw-resize'):q.x?'ew-resize':'ns-resize'):'grab'};e.onpointerdown=ev=>{ev.preventDefault();const q=edge(ev);mode=q.x||q.y?'resize':'drag';const r=e.getBoundingClientRect();startX=ev.clientX;startY=ev.clientY;startW=r.width;startH=r.height;startL=e.offsetLeft;startT=e.offsetTop;e.setPointerCapture(ev.pointerId);e.onpointermove=mv=>{const dx=mv.clientX-startX,dy=mv.clientY-startY;if(mode==='drag'){e.style.left=startL+dx+'px';e.style.top=startT+dy+'px'}else{let w=startW+(q.x*dx),h=startH+(q.y*dy),l=startL,t=startT;if(q.x<0){w=startW-dx;l=startL+dx}if(q.y<0){h=startH-dy;t=startT+dy}w=Math.max(140,w);h=Math.max(100,h);e.style.width=w+'px';e.style.height=h+'px';e.style.left=l+'px';e.style.top=t+'px'}};e.onpointerup=()=>{const a=p().assets.find(x=>x.id===e.dataset.id);if(a){a.x=e.offsetLeft;a.y=e.offsetTop;a.w=e.offsetWidth;a.h=e.offsetHeight;save()}s.selected=e.dataset.id;detailView();mode=null;e.onpointermove=null;e.releasePointerCapture?.(ev.pointerId)}}})};function detailView(){let a=p().assets.find(x=>x.id===s.selected)||s.projects.flatMap(x=>x.assets).find(x=>x.id===s.selected);if(!a){detail.innerHTML='<h3>选择一张图片</h3><p class="muted">图片可以继续以图搜图或交给提示词反推模块。</p>';return}detail.innerHTML=`<h3>${esc(a.title)}</h3><img src="${a.data}"><div class="label">来源</div><div class="link">${esc(a.source||'本地导入')}</div><div style="display:grid;gap:8px;margin-top:18px"><button class="btn primary" onclick="openSearch()">复制图片并打开 Lens</button><button class="btn" onclick="sendToPrompt()">复制图片给提示词插件</button><button class="btn" onclick="removeAsset()">移除图片</button></div>`}async function copyImage(){const a=p().assets.find(x=>x.id===s.selected);if(!a)return false;try{await navigator.clipboard.write([new ClipboardItem({'image/png':dataUrlToBlob(a.data)})]);return true}catch{return false}}async function openSearch(){const copied=await copyImage();window.open('https://www.pinterest.com/lens-search/','_blank');if(!copied)alert('图片已选中，但浏览器不允许自动复制；请使用右侧图片右键复制。')}async function sendToPrompt(){const copied=await copyImage();if(copied)alert('图片已复制，请在 Chrome 的提示词反推插件中粘贴。');else alert('浏览器不允许自动复制，请先右键复制图片。')}function removeAsset(){p().assets=p().assets.filter(x=>x.id!==s.selected);s.selected=null;save();render()}
function dataUrlToBlob(data){const [head,body]=data.split(',');const bytes=atob(body);const arr=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);return new Blob([arr],{type:(head.match(/data:(.*?);/)||[])[1]||'image/png'})}function add(file,source=''){const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);p().assets.unshift({id:crypto.randomUUID(),data:c.toDataURL('image/jpeg',.9),title:file.name||'参考图片',source,group:'ref',x:40+(p().assets.length%5)*250,y:40+Math.floor(p().assets.length/5)*230,w:260,h:190});save();render()};img.onerror=()=>URL.revokeObjectURL(url);img.src=url}document.getElementById('themeToggle').onclick=()=>{const dark=!document.body.classList.contains('dark');document.body.classList.toggle('dark',dark);localStorage.setItem(THEME,dark?'dark':'light')};document.getElementById('import').onclick=()=>file.click();file.onchange=e=>[...e.target.files].forEach(f=>add(f));paste.onclick=async()=>{try{for(const i of await navigator.clipboard.read())for(const t of i.types)if(t.startsWith('image/'))add(await i.getType(t),'剪贴板')}catch{alert('请直接按 Ctrl+V 粘贴图片')}};document.addEventListener('paste',e=>[...e.clipboardData.items].filter(i=>i.type.startsWith('image/')).forEach(i=>add(i.getAsFile(),'剪贴板')));drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).forEach(f=>add(f))};newProject.onclick=()=>{const n=window.prompt('请输入项目名称','新项目');if(n&&n.trim()){s.projects.push({id:crypto.randomUUID(),name:n.trim(),groups:[{id:'all',name:'全部图片'},{id:'ref',name:'参考图'}],assets:[]});s.current=s.projects.at(-1).id;s.group='all';save();render()}};render();
</script></body></html>
